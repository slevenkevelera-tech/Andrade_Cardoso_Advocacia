name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/ai-firebase-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
